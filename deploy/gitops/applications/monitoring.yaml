apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.2.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/deploy/helm/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/luizgnz/chessforge.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/luizgnz/chessforge.git
      targetRevision: HEAD
      path: deploy/k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

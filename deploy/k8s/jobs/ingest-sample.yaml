apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-sample
  namespace: chessforge
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: ingest
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          image: ghcr.io/luizgnz/chessforge:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - chessforge.ingest
            - --source
            - /app/data/sample.pgn
            - --depth
            - "10"
            - --max-games
            - "5"
          env:
            - name: NATS_URL
              value: nats://chessforge-nats:4222
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chessforge-db
                  key: DATABASE_URL

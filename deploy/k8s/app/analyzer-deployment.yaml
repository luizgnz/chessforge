apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer
  namespace: chessforge
  labels:
    app: analyzer
spec:
  # Replica count is owned by KEDA ScaledObject `analyzer` (ADR-014).
  selector:
    matchLabels:
      app: analyzer
  template:
    metadata:
      labels:
        app: analyzer
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: analyzer
          image: ghcr.io/luizgnz/chessforge:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - chessforge.worker
          env:
            - name: NATS_URL
              value: nats://chessforge-nats:4222
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chessforge-db
                  key: DATABASE_URL
            - name: STOCKFISH_PATH
              value: /usr/games/stockfish
          resources:
            requests:
              cpu: "500m"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: chessforge
  labels:
    app: postgres-exporter
data:
  queries.yaml: |
    # Custom query for ADR-015 lost-games alert (metric name: chessforge_lost_games).
    chessforge_lost:
      query: |
        SELECT GREATEST(
          0,
          COALESCE((SELECT SUM(games_enqueued)::bigint FROM ingest_runs), 0)
          - (SELECT COUNT(*)::bigint FROM games)
        ) AS games
      master: true
      metrics:
        - games:
            usage: "GAUGE"
            description: "Games enqueued minus games persisted (lost)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: chessforge
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          imagePullPolicy: IfNotPresent
          # Kind Postgres has no TLS; append sslmode if the Vault URL omits it.
          command:
            - /bin/sh
            - -c
            - |
              case "$DATA_SOURCE_NAME" in
                *sslmode=*) ;;
                *) DATA_SOURCE_NAME="${DATA_SOURCE_NAME}?sslmode=disable" ;;
              esac
              export DATA_SOURCE_NAME
              exec /bin/postgres_exporter \
                --extend.query-path=/etc/postgres_exporter/queries.yaml \
                --web.listen-address=:9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: chessforge-db
                  key: DATABASE_URL
          ports:
            - name: metrics
              containerPort: 9187
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres_exporter
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: queries
          configMap:
            name: postgres-exporter-queries
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: chessforge
  labels:
    app: postgres-exporter
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
      protocol: TCP
